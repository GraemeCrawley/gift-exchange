<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Gift Exchange{% endblock %}</title>
<link rel="stylesheet" href="{{ url('/static/app.css') }}?v={{ static_version }}">
{% if manifest_url %}<link rel="manifest" href="{{ manifest_url }}">{% endif %}
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6B4F">
<link rel="icon" type="image/png" href="{{ url('/static/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url('/static/icon-192.png') }}">
</head>
<body>
<main class="page">
{% block content %}{% endblock %}
</main>
<script src="{{ url('/static/app.js') }}?v={{ static_version }}" defer></script>
</body>
</html>
